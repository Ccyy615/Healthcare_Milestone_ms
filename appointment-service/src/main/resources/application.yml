logging:
    level:
        org:
            springframework:
                jdbc:
                    datasource:
                        init: DEBUG
management:
    endpoint:
        health:
            show-details: always
    endpoints:
        web:
            exposure:
                include: health,info
server:
    port: 8080
services:
    clinic-room:
        url: ${CLINIC_ROOM_SERVICE_URL:http://clinic-room-service:8080}
    doctor:
        url: ${DOCTOR_SERVICE_URL:http://doctor-service:8080}
    patient:
        url: ${PATIENT_SERVICE_URL:http://patient-service:8080}
spring:
    application:
        name: appointment-service
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        password: ${APPOINTMENT_DATASOURCE_PASSWORD:appointment_pwd}
        url: ${APPOINTMENT_DATASOURCE_URL:jdbc:mysql://appointment-db:3306/appointment_service?createDatabaseIfNotExist=true}
        username: ${APPOINTMENT_DATASOURCE_USERNAME:appointment_user}
    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: create
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true
        show-sql: true
    sql:
        init:
            data-locations: classpath:appointment-data.sql
            mode: always
